            statusBox.classList.add('bg-red-950/50', 'text-red-500', 'border-red-900');

            statusBox.classList.add('bg-green-950/50', 'text-green-500', 'border-green-900');
        } else {
            statusBox.classList.add('bg-yellow-950/50', 'text-yellow-500', 'border-yellow-900');

        statusBox.innerHTML = message;
        statusBox.classList.remove('hidden');

        if (!selectedGame) {
            showStatus("Mohon pilih kategori game!", "error");
            return false;
        }
        if (!enteredCode || enteredCode.length !== 20) {
            showStatus("Masukkan 20 digit kode voucher yang valid!", "error");
            return false;
        }
        return { selectedGame, enteredCode };
    };
    // --- LANJUTAN LOGIKA FIREBASE & TOMBOL KONFIRMASI ---
    btnRedeem.addEventListener('click', async () => {
        const inputData = validateInput();
        
        if (inputData) {
            const { selectedGame, enteredCode } = inputData;
            
            btnRedeem.disabled = true;
            btnRedeem.innerText = "VERIFYING...";
            showStatus("Memverifikasi kode...", "info");

            try {
                const codeRef = ref(database, 'active_codes/' + enteredCode);
                const snapshot = await get(codeRef);

                if (snapshot.exists()) {
                    const data = snapshot.val();

                    // 1. Cek kecocokan game
                    if (data.game !== selectedGame) {
                        showStatus(`Maaf, kode ini bukan untuk ${selectedGame}.`, "error");
                        btnRedeem.disabled = false;
                        btnRedeem.innerHTML = `REDEEM NOW`;
                        return;
                    }

                    // 2. Cek status kode
                    if (data.status !== 'active') {
                        showStatus("Gagal! Kode ini sudah pernah digunakan atau kadaluwarsa.", "error");
                        btnRedeem.disabled = false;
                        btnRedeem.innerHTML = `REDEEM NOW`;
                        return;
                    }

                    // 3. Update status di Firebase
                    await update(codeRef, {
                        status: 'used',
                        redeemedAt: Date.now()
                    });

                    // 4. Ambil data link dan informasi
                    const downloadUrl = DOWNLOAD_LINKS[selectedGame];
                    const infoTambahan = GAME_INFO[selectedGame];
                    
                    // 5. Tampilkan Informasi Lengkap & Tombol Konfirmasi Manual
                    showStatus(`
                        <div class="text-left space-y-4">
                            <p class="font-black text-green-500 uppercase tracking-widest text-center">✓ REDEEM BERHASIL</p>
                            <div class="bg-black/40 p-4 rounded-lg border border-green-900/30 text-xs leading-relaxed">
                                ${infoTambahan}
                            </div>
                            <button id="btn-confirm-download" 
                                class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition-all shadow-lg uppercase tracking-tighter text-xs">
                                SAYA MENGERTI, LANJUT KE MEDIAFIRE / MEGA.NZ
                            </button>
                        </div>
                    `, "success");

                    // Sembunyikan tombol redeem asli agar tidak membingungkan
                    btnRedeem.classList.add('hidden');

                    // 6. Tambahkan event listener ke tombol konfirmasi yang baru dibuat
                    document.getElementById('btn-confirm-download').addEventListener('click', () => {
                        window.location.href = downloadUrl;
                    });
                    
                } else {
                    showStatus("Kode tidak ditemukan! Periksa kembali pengetikan Anda.", "error");
                    btnRedeem.disabled = false;
                    btnRedeem.innerHTML = `REDEEM NOW`;
                }

            } catch (error) {
                console.error("Error:", error);
                showStatus("Gagal terhubung ke database.", "error");
                btnRedeem.disabled = false;
                btnRedeem.innerHTML = `REDEEM NOW`;
            }
        }
    });
</script>
