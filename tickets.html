<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Panel | GameVault ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #eee; }
        .font-luxury { font-family: 'Orbitron', sans-serif; }
        .gold-text { color: #FFD700; }
        .glass-effect { backdrop-filter: blur(12px); background: rgba(0, 0, 0, 0.7); border: 2px solid #333; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-6">
            <div>
                <h1 class="text-3xl font-black gold-text font-luxury italic">SUPPORT PANEL</h1>
                <p class="text-gray-500 text-xs tracking-widest uppercase font-bold mt-1">Real-time Ticket Monitoring</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-cyan-900/20 px-4 py-2 rounded-xl border border-cyan-500/30">
                    <span class="text-xs text-cyan-500 font-bold uppercase tracking-widest">Active Queue:</span>
                    <span id="ticket-count" class="ml-2 font-black text-white">0</span>
                </div>
                <a href="seller.html" class="bg-gray-800 text-gray-400 px-4 py-2 rounded-xl text-xs font-bold hover:bg-gray-700 transition-all">← Back</a>
            </div>
        </div>

        <div class="glass-effect rounded-3xl overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-black/80 text-[10px] uppercase tracking-widest text-gray-500 font-black border-b border-gray-800">
                    <tr>
                        <th class="px-8 py-5">Status / Time</th>
                        <th class="px-8 py-5">Game Name</th>
                        <th class="px-8 py-5">Order & Problem</th>
                        <th class="px-8 py-5">UltraViewer Details</th>
                        <th class="px-8 py-5 text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="ticket-list" class="divide-y divide-gray-900">
                    <!-- Tiket muncul di sini -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { database, ref, update, remove, onValue } from "./assets/js/firebase-config.js";

        onValue(ref(database, 'support_tickets'), (snapshot) => {
            const list = document.getElementById('ticket-list');
            if(!snapshot.exists()) {
                document.getElementById('ticket-count').innerText = "0";
                list.innerHTML = '<tr><td colspan="5" class="px-8 py-20 text-center italic text-gray-700">No active support requests...</td></tr>';
                return;
            }

            const data = snapshot.val();
            let tickets = Object.keys(data).map(key => ({ id: key, ...data[key] })).sort((a,b) => b.timestamp - a.timestamp);
            
            // AUTO CLEANUP: Hapus tiket resolved yang sudah lebih dari 1 jam (3600000 ms)
            const ONE_HOUR = 3600000;
            const now = Date.now();
            tickets = tickets.filter(t => {
                if (t.status === 'resolved' && t.resolvedAt && (now - t.resolvedAt > ONE_HOUR)) {
                    remove(ref(database, 'support_tickets/' + t.id));
                    return false; // Jangan tampilkan di UI karena sedang dihapus
                }
                return true;
            });

            document.getElementById('ticket-count').innerText = tickets.length;

            list.innerHTML = tickets.map(t => `
                <tr class="hover:bg-white/[0.02] transition-colors">
                    <td class="px-8 py-6">
                        <span class="text-[9px] font-black px-2 py-1 rounded uppercase tracking-tighter ${t.status === 'waiting' ? 'bg-yellow-950/30 text-yellow-500 border border-yellow-800' : 'bg-cyan-950/30 text-cyan-500 border border-cyan-800'}">
                            ${t.status.replace('_', ' ')}
                        </span>
                        <div class="text-[9px] text-gray-600 mt-2 font-mono">${t.time}</div>
                    </td>
                    <td class="px-8 py-6">
                        <div class="text-[10px] font-black gold-text uppercase tracking-widest">${t.gameName || 'N/A'}</div>
                    </td>
                    <td class="px-8 py-6">
                        <div class="font-bold text-white mb-1 tracking-tight">${t.orderNo}</div>
                        <div class="text-[11px] text-gray-400 italic max-w-xs leading-relaxed">${t.gameProblem}</div>
                    </td>
                    <td class="px-8 py-6">
                        ${t.uvId ? `
                            <div class="bg-cyan-950/20 border border-cyan-500/30 p-3 rounded-xl font-mono text-[11px] animate-pulse">
                                <div class="text-cyan-600 uppercase font-black mb-1">UltraViewer Ready</div>
                                <span class="text-white">ID:</span> ${t.uvId} | <span class="text-white">PASS:</span> ${t.uvPass}
                            </div>
                        ` : `<span class="text-gray-700 text-[10px] font-bold uppercase tracking-widest italic">Waiting for UV...</span>`}
                    </td>
                    <td class="px-8 py-6 text-right space-x-2">
                        ${t.status === 'waiting' ? `<button onclick="processTicket('${t.id}')" class="bg-cyan-600 text-black text-[10px] font-black px-4 py-2 rounded-lg hover:brightness-110">PROCESS</button>` : ''}
                        <button onclick="resolveTicket('${t.id}')" class="text-red-500 text-[10px] font-black hover:underline uppercase tracking-widest">RESOLVE</button>
                    </td>
                </tr>
            `).join('');
        });

        window.processTicket = (id) => {
            update(ref(database, 'support_tickets/' + id), { status: 'processing' });
        };

        window.resolveTicket = (id) => {
            if(confirm("Tandai bantuan selesai? Ini akan memberitahu pelanggan.")) {
                update(ref(database, 'support_tickets/' + id), { 
                    status: 'resolved',
                    resolvedAt: Date.now() // Catat waktu penyelesaian
                });
            }
        };
    </script>
</body>
</html>
