                        <option value="Ubisoft">Ubisoft</option>

                    timestamp: Date.now()
                });
            }
            alert("Import Berhasil!");
        };

        // Fungsi global untuk tombol Edit & Delete
        window.editGame = (id) => {
            const game = gamesCache[id];
            if (!game) return;
            
            editingGameId = id;
            gameNameInput.value = game.name;
            gameCategorySelect.value = game.category;
            downloadLinkInput.value = game.downloadLink;
            installationInfoInput.value = game.installationInfo;
            
            btnAddGame.innerText = "UPDATE GAME";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteGame = async (id) => {
            if (confirm("Hapus game ini dari database?")) {
                try {
                    await remove(ref(database, 'games/' + id));
                    showStatus("Game berhasil dihapus!", "success");
                } catch (e) {
                    showStatus("Gagal menghapus game.", "error");
                }
            }
        };

        // Ambil dan tampilkan daftar game secara real-time
        onValue(ref(database, 'games'), (snapshot) => {
            gamesCache = snapshot.val() || {};
            const keys = Object.keys(gamesCache);
            
            if (keys.length === 0) {
                gameListBody.innerHTML = '<tr><td colspan="3" class="px-4 py-8 text-center text-gray-600 italic">No games found...</td></tr>';
                return;
            }

            gameListBody.innerHTML = keys.map(id => `
                <tr class="hover:bg-white/[0.02] transition-colors">
                    <td class="px-4 py-4 text-xs font-bold text-white">${gamesCache[id].name}</td>
                    <td class="px-4 py-4 text-[10px] text-gray-500 uppercase tracking-widest">${gamesCache[id].category}</td>
                    <td class="px-4 py-4 text-right space-x-3">
                        <button onclick="editGame('${id}')" class="text-yellow-500 text-[10px] font-black hover:underline uppercase">Edit</button>
                        <button onclick="deleteGame('${id}')" class="text-red-600 text-[10px] font-black hover:underline uppercase">Delete</button>
                    </td>
                </tr>
            `).join('');
        });

        btnAddGame.addEventListener('click', async () => {
            const gameName = gameNameInput.value.trim();
            const category = gameCategorySelect.value;
            const downloadLink = downloadLinkInput.value.trim();
            const installationInfo = installationInfoInput.value.trim();

            if (!gameName || !category || !downloadLink || !installationInfo) {
                showStatus("Mohon lengkapi semua kolom!", "error");
                return;
            }

            const gameId = gameName.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();

            // Validasi duplikasi nama game
            if (!editingGameId && gamesCache[gameId]) {
                showStatus("Gagal: Nama game ini sudah ada di database!", "error");
                return;
            }

            if (editingGameId && editingGameId !== gameId && gamesCache[gameId]) {
                showStatus("Gagal: Nama game baru tersebut sudah digunakan oleh game lain!", "error");
                return;
            }

            btnAddGame.disabled = true;
            btnAddGame.innerHTML = `<svg class="animate-spin h-5 w-5 text-black inline-block mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> MENYIMPAN...`;
            statusMessage.classList.add('hidden');

            try {
                // Jika sedang mengedit dan nama game berubah (ID berubah), hapus entri lama
                if (editingGameId && editingGameId !== gameId) {
                    await remove(ref(database, 'games/' + editingGameId));
                }

                await set(ref(database, 'games/' + gameId), {
                    name: gameName,
                    category: category,
                    downloadLink: downloadLink,
                    installationInfo: installationInfo,
                    timestamp: Date.now()
                });

                showStatus(editingGameId ? "Game berhasil diperbarui!" : "Game berhasil ditambahkan!", "success");
                
                // Reset form
                editingGameId = null;
                btnAddGame.innerText = "TAMBAH GAME";
                gameNameInput.value = '';
                gameCategorySelect.value = '';
                downloadLinkInput.value = '';
                installationInfoInput.value = '';
                gameCategorySelect.selectedIndex = 0; // Reset dropdown

            } catch (error) {
                console.error("Error adding game:", error);
                showStatus(`Gagal menambahkan game: ${error.message}`, "error");
            } finally {
                btnAddGame.disabled = false;
                btnAddGame.innerHTML = editingGameId ? `UPDATE GAME` : `TAMBAH GAME`;
            }
        });
    </script>
</body>
</html>
