<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault ID - Customer Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;700&display=swap');
        
        :root {
            --bg-color: #ffffff;
            --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #f3f3f3 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1a1a1a;
            --border-glass: rgba(0, 0, 0, 0.1);
        }

        body.dark-mode {
            --bg-color: #050505;
            --bg-gradient: radial-gradient(circle at center, #1a1608 0%, #050505 100%);
            --card-bg: rgba(10, 10, 10, 0.8);
            --text-main: #eee;
            --border-glass: rgba(212, 175, 55, 0.2);
        }

        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }
        .font-luxury { font-family: 'Orbitron', sans-serif; }

        .gold-gradient {
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
        }
        .gold-text {
            color: #FFD700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        .gold-border {
            border-color: #D4AF37;
        }
        .bg-dark-vault {
            background-color: #050505;
        }
        
        .glow-effect {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.05);
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Shine Animation for Button */
        .btn-shine {
            position: relative;
            overflow: hidden;
        }
        .btn-shine::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
            opacity: 0;
        }
        .btn-shine:hover::after {
            left: 120%;
            opacity: 1;
        }

        .floating-social:hover {
            transform: translateY(-8px) scale(1.15);
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.5));
        }
        
        .glass-effect {
            backdrop-filter: blur(12px);
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
        }

        /* Dust Particles Animation */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            pointer-events: none;
            z-index: -1; /* Pastikan di belakang konten */
            animation: dust-float 30s linear infinite;
            background-image: radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              radial-gradient(circle at 30% 70%, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 500px 500px; /* Ukuran pola partikel */
            opacity: 0.5; /* Mengurangi opasitas untuk efek yang lebih halus */
        }

        @keyframes dust-float {
            0% {
                background-position: 0% 0%;
                transform: scale(1);
            }
            25% {
                background-position: 25% 25%;
                transform: scale(1.02);
            }
            50% {
                background-position: 50% 50%;
                transform: scale(1);
            }
            75% {
                background-position: 75% 25%;
                transform: scale(1.02);
            }
            100% {
                background-position: 100% 0%;
                transform: scale(1);
            }
        }

        /* Shopee Pulse Animation */
        @keyframes shopee-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(238, 77, 45, 0.7); /* Warna oranye Shopee */
            }
            50% {
                box-shadow: 0 0 0 8px rgba(238, 77, 45, 0); /* Memudar keluar */
            }
            100% {
                box-shadow: 0 0 0 0 rgba(238, 77, 45, 0.7); /* Kembali ke awal */
            }
        }
        .shopee-button-pulse { animation: shopee-pulse 2s infinite; }

        /* Dark Mode UI Adjustments */
        body:not(.dark-mode) .text-white, body:not(.dark-mode) h2 { color: #1a1a1a !important; }
        body:not(.dark-mode) select, body:not(.dark-mode) input { 
            background: rgba(0, 0, 0, 0.05); 
            color: #1a1a1a; 
            border-color: rgba(0, 0, 0, 0.1);
        }
        body:not(.dark-mode) .text-gray-500, body:not(.dark-mode) .text-gray-600 { color: #666; }
        body:not(.dark-mode) .bg-black\/50 { background: rgba(0, 0, 0, 0.03); }
    </style>
</head>
<body class="dark-mode min-h-screen flex items-center justify-center p-6 transition-all duration-700">

    <button id="theme-toggle" class="fixed top-6 right-6 z-50 p-3 rounded-full glass-effect hover:scale-110 transition-all duration-300 shadow-xl" title="Toggle Theme">
        <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
    </button>

    <div class="w-full max-w-4xl animate-fade-in">
        
        <div class="text-center mb-10">
            <h1 class="text-5xl font-black gold-text font-luxury tracking-tighter mb-3 italic">VAULTY</h1>
            <p class="text-yellow-700 text-[10px] uppercase tracking-[0.5em] font-black opacity-80">Premium Game Distribution</p>
        </div>

        <div class="glass-effect p-8 md:p-10 rounded-[2.5rem] glow-effect relative overflow-hidden transition-all duration-700 hover:shadow-[0_0_80px_rgba(212,175,55,0.15)] group">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-yellow-500/10 rounded-full blur-3xl group-hover:bg-yellow-500/20 transition-all duration-700"></div>
            
            <div class="relative z-10">
                <h2 class="text-xs font-luxury font-black text-yellow-600 mb-8 text-center tracking-[0.3em] uppercase">Security Clearance Required</h2>
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-[9px] uppercase tracking-[0.3em] text-gray-500 font-black mb-2 ml-2">Phase 1: Game Category</label>
                        <select id="category-select" 
                            class="w-full bg-black/50 border border-white/10 rounded-2xl p-4 text-white focus:border-yellow-500/50 focus:outline-none transition-all appearance-none cursor-pointer hover:bg-black/80">
                            <option value="" disabled selected>-- Pilih Kategori --</option>
                            <option value="EA">Electronic Arts (EA)</option>
                            <option value="Rockstar Games">Rockstar Games</option>
                            <option value="Ubisoft">Ubisoft</option>
                            <option value="Denuvo">Denuvo Protected</option>
                            <option value="Other">Other Publishers</option>
                        </select>
                    </div>

                    <div id="game-select-container" class="hidden opacity-0">
                        <label class="block text-[9px] uppercase tracking-[0.3em] text-gray-500 font-black mb-2 ml-2">Phase 2: Target Title</label>
                        <select id="game-select" 
                            class="w-full bg-black/50 border border-white/10 rounded-2xl p-4 text-white focus:border-yellow-500/50 focus:outline-none transition-all appearance-none cursor-pointer hover:bg-black/80">
                            <option value="" disabled selected>-- Pilih Game Anda --</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[9px] uppercase tracking-[0.3em] text-gray-500 font-black mb-2 ml-2">Phase 3: Access Code</label>
                        <input type="text" id="voucher-code" 
                            maxlength="20"
                            class="w-full bg-black/50 border border-white/10 rounded-2xl p-4 text-white focus:border-yellow-500/50 focus:outline-none transition-all font-mono placeholder:text-zinc-800 text-center tracking-[0.2em]"
                            placeholder="0000-0000-0000-0000"
                            autocomplete="off">
                    </div>

                    <button id="btn-redeem" 
                        class="w-full gold-gradient text-black font-black py-4 rounded-2xl hover:scale-[1.02] active:scale-[0.95] transition-all shadow-2xl font-luxury text-sm tracking-widest mt-6 flex items-center justify-center gap-3 btn-shine">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                        REDEEM NOW
                    </button>

                    <div id="redeem-status" class="hidden text-center p-5 rounded-2xl border font-bold text-xs tracking-wide transition-all animate-fade-in">
                        </div>
                </div>
            </div>
        </div>

        <div class="mt-8 text-center">
            <p class="text-gray-600 text-[10px] uppercase tracking-widest font-bold">
                System Protected • Secure Transaction • Vault v2.1
            </p>
        </div>

    </div>

    <div class="fixed bottom-6 right-6 flex flex-col gap-4 z-50">
        <a href="ticketc.html" 
            class="floating-social w-14 h-14 bg-cyan-600 rounded-full flex items-center justify-center shadow-2xl transition-all duration-300 group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
        </a>

        <a href="https://discord.gg/SXbHmkFaPz" target="_blank" 
            class="floating-social w-14 h-14 bg-[#5865F2] rounded-full flex items-center justify-center shadow-2xl transition-all duration-300 group">
            <svg class="w-7 h-7 text-white fill-current" viewBox="0 0 24 24">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.086 2.157 2.419c0 1.334-.947 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.086 2.157 2.419c0 1.334-.946 2.419-2.157 2.419z"/>
            </svg>
        </a>
        
        <a href="https://shopee.co.id/shop/1486576278" target="_blank" 
            class="floating-social w-14 h-14 bg-black rounded-full flex items-center justify-center shadow-2xl transition-all duration-300 group overflow-hidden border-2 border-[#EE4D2D] shopee-button-pulse">
            <img src="shopee.png" class="w-10 h-10 object-contain group-hover:animate-[spin_4s_linear_infinite]" alt="Shopee">
        </a>
    </div>

    <script type="module">
    import { database, ref, get, update, onValue } from "./assets/js/firebase-config.js";

    let allGames = [];

    const categorySelect = document.getElementById('category-select');
    const gameSelectContainer = document.getElementById('game-select-container');
    const gameSelect = document.getElementById('game-select');
    const voucherInput = document.getElementById('voucher-code');
    const btnRedeem = document.getElementById('btn-redeem');
    const statusBox = document.getElementById('redeem-status');

    // Ambil data game dari Firebase secara Real-time
    onValue(ref(database, 'games'), (snapshot) => {
        if (snapshot.exists()) {
            allGames = Object.values(snapshot.val());
        }
    });

    // Logika pemilihan kategori
    categorySelect.addEventListener('change', () => {
        const selectedCat = categorySelect.value;
        // Filter allGames berdasarkan kategori yang dipilih
        const filteredGames = allGames.filter(game => game.category === selectedCat);
        
        gameSelect.innerHTML = '<option value="" disabled selected>-- Pilih Game Anda --</option>';
        // Urutkan abjad dan masukkan ke dropdown
        filteredGames.sort((a, b) => a.name.localeCompare(b.name)).forEach(game => {
            const formattedPrice = game.price ? ` - Rp ${game.price.toLocaleString('id-ID')}` : ' - Free';
            gameSelect.innerHTML += `<option value="${game.name}">${game.name}${formattedPrice}</option>`;
        });

        // Memicu animasi transisi modern
        gameSelectContainer.classList.remove('hidden', 'animate-fade-in');
        void gameSelectContainer.offsetWidth; // Trigger reflow untuk meriset animasi
        gameSelectContainer.classList.add('animate-fade-in');
    });

    // Fungsi menampilkan status dengan gaya box yang elegan
    const showStatus = (message, type) => {
        statusBox.classList.remove('hidden', 'bg-red-950/50', 'text-red-500', 'border-red-900', 'bg-green-950/50', 'text-green-500', 'border-green-900', 'bg-yellow-950/50', 'text-yellow-500', 'border-yellow-900');
        
        if (type === 'error') {
            statusBox.classList.add('bg-red-950/50', 'text-red-500', 'border-red-900');
        } else if (type === 'success') {
            statusBox.classList.add('bg-green-950/50', 'text-green-500', 'border-green-900');
        } else {
            statusBox.classList.add('bg-yellow-950/50', 'text-yellow-500', 'border-yellow-900');
        }
        
        statusBox.innerHTML = message;
        statusBox.classList.remove('hidden');
    };

    const validateInput = () => {
        const selectedGame = gameSelect.value;
        const enteredCode = voucherInput.value.trim().toUpperCase();

        if (!selectedGame) {
            showStatus("Mohon pilih game yang ingin diredeem!", "error");
            return false;
        }
        if (!enteredCode || enteredCode.length !== 20) {
            showStatus("Masukkan 20 digit kode voucher yang valid!", "error");
            return false;
        }
        return { selectedGame, enteredCode };
    };
    // --- LANJUTAN LOGIKA FIREBASE & TOMBOL KONFIRMASI ---
    btnRedeem.addEventListener('click', async () => {
        const inputData = validateInput();
        
        if (inputData) {
            const { selectedGame, enteredCode } = inputData;
            
            btnRedeem.disabled = true;
            btnRedeem.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                VERIFYING...
            `;
            showStatus("Memverifikasi kode...", "info");

            try {
                const codeRef = ref(database, 'active_codes/' + enteredCode);
                const snapshot = await get(codeRef);

                if (snapshot.exists()) {
                    const data = snapshot.val();

                    // 1. Cek kecocokan game
                    if (data.game !== selectedGame) {
                        showStatus(`Maaf, kode ini bukan untuk ${selectedGame}.`, "error");
                        btnRedeem.disabled = false;
                        btnRedeem.innerHTML = `
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                            REDEEM NOW
                        `;
                        return;
                    }

                    // 2. Cek status kode
                    if (data.status !== 'active') {
                        showStatus("Gagal! Kode ini sudah pernah digunakan atau kadaluwarsa.", "error");
                        btnRedeem.disabled = false;
                        btnRedeem.innerHTML = `
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                            REDEEM NOW
                        `;
                        return;
                    }

                    // 3. Update status di Firebase
                    await update(codeRef, {
                        status: 'used',
                        redeemedAt: Date.now()
                    });

                    // 4. Ambil data link dan informasi
                    const gameDetails = allGames.find(game => game.name === selectedGame);
                    const downloadUrl = gameDetails ? gameDetails.downloadLink : '#';
                    const infoTambahan = gameDetails ? gameDetails.installationInfo : 'Informasi instalasi tidak ditemukan.';
                    
                    // 5. Tampilkan Informasi Lengkap & Tombol Konfirmasi Manual
                    showStatus(`
                        <div class="text-left space-y-4">
                            <p class="font-black text-green-500 uppercase tracking-widest text-center">✓ REDEEM BERHASIL</p>
                            <div class="bg-black/40 p-4 rounded-lg border border-green-900/30 text-xs leading-relaxed">
                                ${infoTambahan || 'Tidak ada instruksi instalasi yang tersedia.'}
                            </div>
                            <button id="btn-confirm-download" 
                                class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition-all shadow-lg uppercase tracking-tighter text-xs">
                                SAYA MENGERTI, LANJUT KE MEDIAFIRE / MEGA.NZ
                            </button>
                        </div>
                    `, "success");

                    // Sembunyikan tombol redeem asli agar tidak membingungkan
                    btnRedeem.classList.add('hidden');

                    // 6. Tambahkan event listener ke tombol konfirmasi yang baru dibuat
                    document.getElementById('btn-confirm-download').addEventListener('click', () => {
                        window.location.href = downloadUrl;
                    });
                    
                } else {
                    showStatus("Kode tidak ditemukan! Periksa kembali pengetikan Anda.", "error");
                    btnRedeem.disabled = false;
                    btnRedeem.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                        REDEEM NOW
                    `;
                }

            } catch (error) {
                console.error("Error:", error);
                showStatus("Gagal terhubung ke database.", "error");
                btnRedeem.disabled = false;
                btnRedeem.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    REDEEM NOW
                `;
            }
        }
    });

    // --- 3. REVISI LOGIKA UTK TEMA DEFAULT DARK MODE ---
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const body = document.body;

    // Jika belum ada preferensi tersimpan, set default menjadi 'dark'
    const savedTheme = localStorage.getItem('theme') || 'dark';
    
    if (savedTheme === 'dark') {
        body.classList.add('dark-mode');
        updateThemeIcon(true);
    } else {
        body.classList.remove('dark-mode');
        updateThemeIcon(false);
    }

    themeToggle.addEventListener('click', () => {
        const isDark = body.classList.toggle('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateThemeIcon(isDark);
    });

    function updateThemeIcon(isDark) {
        if (isDark) {
            themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />`;
        } else {
            themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />`;
        }
    }
</script>
</body>
</html>
